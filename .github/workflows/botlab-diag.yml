name: Diagnóstico de bots (Nova Bot Lab)
# Se corre a mano: explica por qué un bot no opera y optimiza el indicador Nova Nexus v2.7 como bot (con validación fuera de muestra).
on:
  workflow_dispatch:
    inputs:
      detail: {description: '1 = solo 1h/4h con detalle por dirección · 2 = prueba de los bots tal como quedan · pachita = buscar la mejor configuración de Pachita', default: '0'}
      coins: {description: 'Monedas (coma)', default: 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,SUIUSDT'}
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: if [ "$DETAIL" = "pachita" ]; then node scripts/pachita-opt.js; else node scripts/botlab-diag.js; fi
        env: {COINS: '${{ inputs.coins }}', DETAIL: '${{ inputs.detail }}'}
