name: Actualizar noticias
# Copia de respaldo de noticias y calendario cada ~3 h (la app ya las trae al momento cuando abres Noticias; no hace falta más seguido).
on:
  schedule: [{cron: '41 */3 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: news, cancel-in-progress: true}
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/fetch-news.js
      - name: Guardar si cambió
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add news-data.json; if [ -f calendar-data.json ]; then git add calendar-data.json; fi
          git diff --cached --quiet || (git commit -m "chore: noticias" && git pull --rebase -q && git push)
