name: Sala · telemetría de bots y cerebros (solo lectura)
on:
  schedule: [{cron: '11 * * * *'}]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: sala-telemetria
  cancel-in-progress: false
jobs:
  leer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --prefix /tmp/sala-deps --no-audit --no-fund --ignore-scripts firebase-admin@12
      - run: node scripts/sala-telemetry.cjs
        env:
          NODE_PATH: /tmp/sala-deps/node_modules
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telemetria-sala
          path: out-sala/telemetria.json
          retention-days: 30
