name: Optimizar Pachita (Nova Bot Lab)
# Se corre a mano: busca la mejor configuración de Pachita (15 m) con datos reales y validación fuera de muestra. No cambia nada de tu cuenta.
on:
  workflow_dispatch:
    inputs:
      bars: {description: 'Velas por moneda', default: '20000'}
      iv: {description: 'Temporalidad', default: '15m'}
permissions: {contents: read}
jobs:
  opt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/pachita-opt.js
        env: {BARS: '${{ inputs.bars }}', IV: '${{ inputs.iv }}'}
