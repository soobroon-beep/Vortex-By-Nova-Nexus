name: Diagnóstico Nexus Pixel (temporal, sin secretos)
on:
  push:
    branches: [pixel-diag]
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: pixel-fix}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prueba en vivo de la IA de Nexus Pixel (llm.js real contra los servidores reales)
        run: |
          cat > /tmp/raw.sh <<'SH'
          M='[{"role":"user","content":"Responde solo: hola"}]'
          for i in 1 2 3 4; do curl -s -m 40 -D /tmp/h -o /tmp/b -w "anon $i HTTP %{http_code} %{time_total}s\n" -X POST https://text.pollinations.ai/openai -H 'content-type: application/json' -d "{\"model\":\"openai\",\"messages\":$M}"; grep -i "retry\|ratelimit\|x-" /tmp/h | head -5; head -c 300 /tmp/b; echo; sleep 2; done
          echo "== sin origin al worker"; curl -s -m 30 -w ' [HTTP %{http_code}]' -X POST https://vortex-push.soobroon.workers.dev/ai -H 'content-type: application/json' -d "{\"model\":\"openai\",\"task\":\"pixel\",\"messages\":$M,\"max_tokens\":40}" | head -c 300; echo
          SH
          bash /tmp/raw.sh
