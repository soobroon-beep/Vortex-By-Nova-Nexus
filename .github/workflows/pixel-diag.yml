name: Diagnóstico Nexus Pixel (temporal, sin secretos)
on:
  push:
    branches: [pixel-diag]
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: pixel-fix}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prueba en vivo de la IA de Nexus Pixel (llm.js real contra los servidores reales)
        run: |
          cat > /tmp/live.js <<'JS'
          const L = require(process.cwd() + '/llm.js');
          const realFetch = global.fetch, ORIGIN = 'https://vortex-nexus.pages.dev';
          const browserFetch = (u, o = {}) => /vortex-push/.test(String(u)) ? realFetch(u, {...o, headers: {...(o.headers || {}), origin: ORIGIN}}) : realFetch(u, o); // como el navegador (manda Origin)
          global.fetch = browserFetch;
          const sys = {role: 'system', content: 'Eres NEXUS PIXEL, copiloto de trading. Responde SOLO JSON {"reply":"...","actions":[]} en español.'};
          const q = t => [sys, {role: 'user', content: t + '\nDATOS: BTCUSDT 1h, último 94471, EMA200 92000, RSI 58, tendencia alcista.'}];
          (async () => {
            let fails = 0; const run = async (name, fn) => { const t = Date.now(); try { const r = await fn(); console.log('OK   ', name, '|', r.model, '|', (Date.now() - t) + 'ms |', String(r.text).replace(/\s+/g, ' ').slice(0, 140)); } catch (e) { fails++; console.log('FALLA', name, '|', e.kind, e.message, (Date.now() - t) + 'ms'); } };
            for (let i = 1; i <= 3; i++) await run('servidor VORTEX pixel ' + i, () => L.pixelChat(q('pregunta ' + i + ': ¿long, short o esperar?'), {json: true}));
            await run('servidor VORTEX texto (noticias/screener)', () => L.pixelChat([{role: 'user', content: 'Resume en 1 frase: BTC sube 2% por entradas a ETF.'}], {maxTokens: 120}));
            global.fetch = (u, o) => /vortex-push/.test(String(u)) ? Promise.reject(new TypeError('Failed to fetch')) : realFetch(u, o);
            for (let i = 1; i <= 2; i++) await run('servidor CAÍDO → sin clave ' + i, () => L.pixelChat(q('caso ' + i + ' ' + Date.now() + ': ¿qué ves en la estructura?'), {json: true}));
            process.exitCode = fails ? 1 : 0;
          })();
          JS
          node /tmp/live.js
