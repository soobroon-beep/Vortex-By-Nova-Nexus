name: Publicar servidor de avisos (vortex-push)
# Publica worker/push-alerts.mjs en tu Cloudflare como el Worker «vortex-push» (cron cada minuto + KV «vortex-push»).
# Es el que te manda las notificaciones de alertas aunque VORTEX esté cerrada.
# Requiere el secreto CLOUDFLARE_API_TOKEN (plantilla «Edit Cloudflare Workers»). Opcional: CLOUDFLARE_ACCOUNT_ID si tu token ve varias cuentas.
# Sin el secreto el flujo termina sin hacer nada (no falla).
on:
  push:
    branches: [main]
    paths: ['worker/push-alerts.mjs', 'worker/devstore.mjs', 'worker/fbauth.mjs', 'worker/memoria.mjs', 'worker/screener.mjs', 'worker/radar-server.mjs', 'radar.js', 'trade-watch.js', 'scripts/bot-push-key.js', 'alert-eval.js', 'worker/wrangler-push.toml', 'nova-nexus.js', 'discord-format.js', 'dominance-core.js', '.github/workflows/deploy-push-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: {group: deploy-push-worker, cancel-in-progress: false}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Pruebas del Worker
        run: node --test tests/memoria.test.js tests/push-worker.test.js tests/worker-screener.test.js tests/radar.test.js tests/radar-server.test.js tests/alerts-exchanges.test.js tests/ind-alerts.test.js tests/push-scale-security.test.js
      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BINGX_AGENT_KEY: ${{ secrets.BINGX_AGENT_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          BINGX_AGENT_SECRET: ${{ secrets.BINGX_AGENT_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions). No se publica nada."; exit 0
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          # con la base D1 (miles de celulares); si el token no tiene permiso de D1, se publica sin ella (el Worker usa el KV)
          if ! npx --yes wrangler@4 deploy --config worker/wrangler-push.toml; then
            echo "::warning::No se pudo publicar con la base D1 (¿el token de Cloudflare no tiene permiso «D1 Edit»?). Se publica con el KV: máx. 40 celulares."
            sed '/# >>> D1/,/# <<< D1/d' worker/wrangler-push.toml > worker/wrangler-push-kv.toml
            npx --yes wrangler@4 deploy --config worker/wrangler-push-kv.toml
          fi
          # el webhook del canal #vortex pasa del secreto de GitHub al del servidor (nunca queda en el código)
          if [ -n "$DISCORD_WEBHOOK" ]; then printf '%s' "$DISCORD_WEBHOOK" | npx --yes wrangler@4 secret put DISCORD_WEBHOOK --config worker/wrangler-push.toml; fi
          # plan Infinity: llave de AFILIADO de BingX (solo lectura) para comprobar que el UID entró con tu código
          if [ -n "$BINGX_AGENT_KEY" ]; then printf '%s' "$BINGX_AGENT_KEY" | npx --yes wrangler@4 secret put BINGX_AGENT_KEY --config worker/wrangler-push.toml; fi
          if [ -n "$BINGX_AGENT_SECRET" ]; then printf '%s' "$BINGX_AGENT_SECRET" | npx --yes wrangler@4 secret put BINGX_AGENT_SECRET --config worker/wrangler-push.toml; fi
          # IA gratis de respaldo (Groq): solo si existe el secreto GROQ_KEY
          # avisos de tus bots (Nova Bot Lab) a tu celular: llave compartida con el paper trading, derivada de FIREBASE_SERVICE_ACCOUNT
          BPK="$(node scripts/bot-push-key.js)"; if [ -n "$BPK" ]; then printf '%s' "$BPK" | npx --yes wrangler@4 secret put BOT_PUSH_KEY --config worker/wrangler-push.toml; fi
          # planes verificados en el servidor: la cuenta de servicio escribe plans/{uid} en Firestore (la app ya no puede darse un plan sola)
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx --yes wrangler@4 secret put FB_SA --config worker/wrangler-push.toml; fi
          if [ -n "$GROQ_KEY" ]; then printf '%s' "$GROQ_KEY" | npx --yes wrangler@4 secret put GROQ_KEY --config worker/wrangler-push.toml; fi
          # IA gratis EXTRA solo para Nexus Pixel (cada una opcional, sin tarjeta): Google AI Studio, Mistral (plan Experiment) y OpenRouter
          if [ -n "$GEMINI_KEY" ]; then printf '%s' "$GEMINI_KEY" | npx --yes wrangler@4 secret put GEMINI_KEY --config worker/wrangler-push.toml; fi
          if [ -n "$MISTRAL_KEY" ]; then printf '%s' "$MISTRAL_KEY" | npx --yes wrangler@4 secret put MISTRAL_KEY --config worker/wrangler-push.toml; fi
          if [ -n "$OPENROUTER_KEY" ]; then printf '%s' "$OPENROUTER_KEY" | npx --yes wrangler@4 secret put OPENROUTER_KEY --config worker/wrangler-push.toml; fi
