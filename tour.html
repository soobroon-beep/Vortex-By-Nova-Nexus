<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bienvenido a VORTEX</title>
<style>
@font-face{font-family:'Geist';src:url(fonts/geist.woff2) format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03050a;overflow:hidden;font-family:Geist,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eef2fa;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;height:100dvh}
#stage{position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;container-type:inline-size;opacity:0;transition:opacity .6s}
#stage.on{opacity:1}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.gl{background:rgba(16,21,36,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.10);color:#eef2fa}
button{font-family:inherit;cursor:pointer}
#skip{position:absolute;top:2.2cqw;right:1.8cqw;display:flex;align-items:center;gap:.5cqw;padding:.6cqw 1.15cqw;border-radius:99px;font-size:max(11px,.85cqw);font-weight:600;letter-spacing:.01em;transition:background .25s,transform .25s,border-color .25s}
#skip:hover{background:rgba(40,50,80,.7);border-color:rgba(255,255,255,.22);transform:translateX(-2px)}
#skip svg{width:max(11px,.8cqw);height:max(11px,.8cqw);transition:transform .25s}
#skip:hover svg{transform:translateX(3px)}
#bar{position:absolute;left:50%;bottom:1.6cqw;transform:translateX(-50%);width:min(64cqw,100% - 24px);display:flex;align-items:center;gap:1cqw;padding:.55cqw .8cqw;border-radius:99px;opacity:.72;transition:opacity .3s}
#bar:hover{opacity:1}
.ib{width:max(26px,2.1cqw);height:max(26px,2.1cqw);border-radius:50%;border:0;background:rgba(255,255,255,.06);display:grid;place-items:center;color:#dfe5f2;transition:background .2s,transform .2s;flex:none}
.ib:hover{background:rgba(255,255,255,.14);transform:scale(1.08)}
.ib svg{width:48%;height:48%}
#track{flex:1;display:flex;gap:4px;height:max(18px,1.5cqw);align-items:center}
.seg{position:relative;height:100%;display:flex;align-items:center;cursor:pointer}
.seg i{display:block;width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;transition:height .2s}
.seg b{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ccfff,#8f7bff);border-radius:3px}
.seg:hover i{height:7px}
.seg::after{content:attr(data-l);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;font-size:max(10px,.75cqw);font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(20,26,44,.95);border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.seg:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
#rotate{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:13px;padding:8px 14px;border-radius:99px;display:none;white-space:nowrap}
@media (max-width:900px),(max-height:520px){
#skip{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;font-size:12px;padding:7px 13px;gap:6px}
#skip svg{width:12px;height:12px}
#bar{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));width:min(540px,calc(100vw - 24px));padding:5px 8px;gap:8px;opacity:.85}
.ib{width:28px;height:28px}
#track{height:18px}
.seg::after{font-size:11px}
}
body.m #stage{width:min(100vw,calc(100dvh*780/1688));aspect-ratio:780/1688}
body.m #rotate{display:none}
@media (orientation:portrait) and (max-width:820px){body:not(.m) #rotate{display:block;bottom:70px}}
#bye{position:fixed;inset:0;background:#03050a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;pointer-events:none;transition:opacity .7s}
#bye.on{opacity:1;pointer-events:auto}
#bye .t{font-size:22px;font-weight:600;color:#cbd3e4}
#bye a{opacity:0;transition:opacity .5s;color:#05070d;background:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:99px}
#bye a.on{opacity:1}
#bye svg{width:110px;height:110px;animation:pul 1.6s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.06);filter:drop-shadow(0 0 18px rgba(150,180,255,.6))}}
</style>

  <div id="track"></div>

 </div>
</div>

<script>
// ======================= BASE =======================
let W=1920,H=1080;const FPS=30,DUR=86;
const cv=document.getElementById('c');let K=1,A=0,IDLE=0,PLAYING=true,HITS=[],DEFER=[],MOUSE={x:-1,y:-1};const HV={};const SEL={theme:0,plan:-1};
function hov(id){return HV[id]||0}
function hit(id,x,y,w,h){if(ctx.globalAlpha<0.35)return;const m=ctx.getTransform();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[a,b]of[[x,y],[x+w,y],[x,y+h],[x+w,y+h]]){const px=m.a*a+m.c*b+m.e,py=m.b*a+m.d*b+m.f;x0=Math.min(x0,px);y0=Math.min(y0,py);x1=Math.max(x1,px);y1=Math.max(y1,py)}HITS.push({id,x0,y0,x1,y1})}
function localMouse(){if(MOUSE.x<0)return null;const p=ctx.getTransform().inverse().transformPoint(new DOMPoint(MOUSE.x,MOUSE.y));return p}
function tip(l,x,y,a,side){const w=tw(l,{s:12,w:600})+22;ctx.save();ctx.globalAlpha*=a;const X=side==='left'?x-w:x;glass(X,y-14,w,28,14,1,'rgba(22,28,48,0.94)');txt(l,X+w/2,y+4,{s:12,w:600,a:'center'});ctx.restore()}

const ctx=cv.getContext('2d');
const C={bg:'#03050a',text:'#eef2fa',dim:'#8b94aa',dim2:'#5b647a',up:'#2bd69c',down:'#f2556d',cyan:'#5ccfff',violet:'#8f7bff',gold:'#f4c55b',line:'rgba(255,255,255,0.08)',pink:'#ff5fa8'};
const FD='Geist, "Inter Display", Inter, system-ui, sans-serif', FI='Geist, Inter, system-ui, sans-serif';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eout=p=>1-Math.pow(1-p,3);
const eback=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const ep=(t,a,b)=>eio(pr(t,a,b));
const eo=(t,a,b)=>eout(pr(t,a,b));
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function track(t,keys){if(t<=keys[0][0])return keys[0][1];for(let i=0;i<keys.length-1;i++){const[t0,v0]=keys[i],[t1,v1]=keys[i+1];if(t<=t1)return lerpV(v0,v1,eio(clamp((t-t0)/(t1-t0))))}return keys[keys.length-1][1]}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function fmt(n,d=2){return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})}

// ======================= ICONOS =======================
function icon(n,x,y,s,col=C.text,lw=1.7){
 ctx.save();ctx.translate(x,y);ctx.scale(s/24,s/24);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw*24/s*(s/24);ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
 const B=()=>ctx.beginPath(),S=()=>ctx.stroke(),F=()=>ctx.fill();
 switch(n){
 case'cursor':B();ctx.moveTo(-6,-9);ctx.lineTo(7,2);ctx.lineTo(1,3);ctx.lineTo(-2,9);ctx.closePath();S();break;
 case'trend':B();ctx.moveTo(-8,7);ctx.lineTo(8,-7);S();B();ctx.arc(-8,7,2,0,7);F();B();ctx.arc(8,-7,2,0,7);F();break;
 case'fib':for(const yy of[-7,-2,3,8]){B();ctx.moveTo(-9,yy);ctx.lineTo(9,yy);S()}B();ctx.moveTo(-9,8);ctx.lineTo(9,-7);ctx.globalAlpha=.5;S();break;

 case'text':B();ctx.moveTo(-7,-7);ctx.lineTo(7,-7);ctx.moveTo(0,-7);ctx.lineTo(0,8);S();break;
 case'star':B();for(let i=0;i<10;i++){const r=i%2?4:9.5,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();S();break;
 case'starf':B();for(let i=0;i<10;i++){const r=i%2?4:9.5,a=-Math.PI/2+i*Math.PI/5;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();F();break;
 case'list':for(const yy of[-6,0,6]){B();ctx.arc(-7,yy,1.3,0,7);F();B();ctx.moveTo(-3,yy);ctx.lineTo(9,yy);S()}break;
 case'news':rr(-9,-8,18,16,3);S();B();ctx.moveTo(-5,-3);ctx.lineTo(5,-3);ctx.moveTo(-5,1);ctx.lineTo(5,1);ctx.moveTo(-5,5);ctx.lineTo(1,5);S();break;
 case'scan':B();ctx.moveTo(-8,8);ctx.lineTo(-8,2);ctx.moveTo(-3,8);ctx.lineTo(-3,-2);ctx.moveTo(2,8);ctx.lineTo(2,-6);ctx.moveTo(7,8);ctx.lineTo(7,-9);S();break;
 case'bell':B();ctx.moveTo(-7,5);ctx.lineTo(-7,-1);ctx.arc(0,-1,7,Math.PI,0);ctx.lineTo(7,5);ctx.lineTo(-8,5);ctx.lineTo(8,5);S();B();ctx.arc(0,8,2,0,Math.PI);S();break;
 case'spark':B();ctx.moveTo(0,-10);ctx.quadraticCurveTo(1,-1,10,0);ctx.quadraticCurveTo(1,1,0,10);ctx.quadraticCurveTo(-1,1,-10,0);ctx.quadraticCurveTo(-1,-1,0,-10);S();B();ctx.arc(7,-7,1.4,0,7);F();break;
 case'robot':rr(-8,-5,16,13,4);S();B();ctx.arc(-3.5,1.5,1.6,0,7);ctx.arc(3.5,1.5,1.6,0,7);F();B();ctx.moveTo(0,-5);ctx.lineTo(0,-9);S();B();ctx.arc(0,-10,1.5,0,7);F();break;
 case'lens':ctx.font='800 15px '+FD;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('NL',0,1);break;
 case'radar':B();ctx.arc(0,0,9,0,7);S();B();ctx.arc(0,0,5,0,7);ctx.globalAlpha=.6;S();ctx.globalAlpha=1;B();ctx.moveTo(0,0);ctx.lineTo(6.5,-6.5);S();B();ctx.arc(0,0,1.6,0,7);F();break;
 case'discord':B();ctx.moveTo(-9,4);ctx.quadraticCurveTo(-9,-6,-5,-7);ctx.lineTo(-3,-5);ctx.lineTo(3,-5);ctx.lineTo(5,-7);ctx.quadraticCurveTo(9,-6,9,4);ctx.quadraticCurveTo(6,8,3,7);ctx.lineTo(2,5);ctx.lineTo(-2,5);ctx.lineTo(-3,7);ctx.quadraticCurveTo(-6,8,-9,4);ctx.closePath();S();B();ctx.arc(-3.2,0.5,1.6,0,7);ctx.arc(3.2,0.5,1.6,0,7);F();break;
 case'user':B();ctx.arc(0,-3,4,0,7);S();B();ctx.arc(0,11,8,Math.PI*1.15,Math.PI*1.85);S();break;
 case'moon':B();ctx.arc(0,0,8,0.9,Math.PI*2-0.9+Math.PI*0.0);ctx.arc(4,-3,6,Math.PI*1.75,Math.PI*0.65,true);S();break;
 case'gear':B();ctx.arc(0,0,3.2,0,7);S();for(let i=0;i<8;i++){const a=i*Math.PI/4;B();ctx.moveTo(Math.cos(a)*6,Math.sin(a)*6);ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9);S()}B();ctx.arc(0,0,6.5,0,7);S();break;
 case'candle':B();ctx.moveTo(-4,-9);ctx.lineTo(-4,9);ctx.moveTo(4,-6);ctx.lineTo(4,7);S();ctx.fillRect(-6.5,-5,5,9);rr(1.5,-3,5,7,1);S();break;
 case'cal':rr(-8,-7,16,15,3);S();B();ctx.moveTo(-8,-2);ctx.lineTo(8,-2);ctx.moveTo(-4,-9);ctx.lineTo(-4,-5);ctx.moveTo(4,-9);ctx.lineTo(4,-5);S();break;
 case'calc':rr(-7,-9,14,18,3);S();ctx.fillRect(-4,-6,8,3);for(const[a,b]of[[-3,2],[0,2],[3,2],[-3,6],[0,6],[3,6]]){B();ctx.arc(a,b,1,0,7);F()}break;
 case'replay':B();ctx.arc(0,0,8,-Math.PI*0.9,Math.PI*0.7);S();B();ctx.moveTo(-9,-7);ctx.lineTo(-7.5,-2.5);ctx.lineTo(-3,-4);S();B();ctx.moveTo(-1.5,-3.5);ctx.lineTo(3.5,0);ctx.lineTo(-1.5,3.5);ctx.closePath();F();break;
 case'layers':B();ctx.moveTo(0,-8);ctx.lineTo(9,-3);ctx.lineTo(0,2);ctx.lineTo(-9,-3);ctx.closePath();S();B();ctx.moveTo(-9,2);ctx.lineTo(0,7);ctx.lineTo(9,2);S();break;
 case'globe':B();ctx.arc(0,0,9,0,7);S();B();ctx.ellipse(0,0,4,9,0,0,7);S();B();ctx.moveTo(-9,0);ctx.lineTo(9,0);S();break;
 case'clock':B();ctx.arc(0,0,9,0,7);S();B();ctx.moveTo(0,-5);ctx.lineTo(0,0);ctx.lineTo(4,3);S();break;
 case'mic':rr(-3,-9,6,11,3);S();B();ctx.arc(0,-1,6.5,0.2,Math.PI-0.2);S();B();ctx.moveTo(0,5.5);ctx.lineTo(0,9);S();break;
 case'plus':B();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.moveTo(0,-7);ctx.lineTo(0,7);S();break;
 case'google':ctx.lineWidth=3;B();ctx.arc(0,0,8,-0.6,Math.PI*1.75);S();B();ctx.moveTo(0,0);ctx.lineTo(8,0);S();break;

 case'flow':B();ctx.arc(-6,-5,2.5,0,7);ctx.moveTo(8.5,5);ctx.arc(6,5,2.5,0,7);S();B();ctx.moveTo(-3.5,-5);ctx.lineTo(1,-5);ctx.quadraticCurveTo(4,-5,4,-1);ctx.lineTo(4,2.5);S();break;

 case'home':B();ctx.moveTo(-8,-1);ctx.lineTo(0,-8);ctx.lineTo(8,-1);ctx.moveTo(-6,-2);ctx.lineTo(-6,8);ctx.lineTo(6,8);ctx.lineTo(6,-2);S();break;

 ctx.restore()}

// ======================= LOGO VORTEX =======================
function vstar(x,y,r,a=1){ctx.save();ctx.globalAlpha*=a;ctx.beginPath();for(let i=0;i<8;i++){const rad=i%2?r*0.28:r,an=-Math.PI/2+i*Math.PI/4;ctx.lineTo(x+Math.cos(an)*rad,y+Math.sin(an)*rad)}ctx.closePath();ctx.fill();ctx.restore()}
function logo(x,y,s,o={}){ // s = alto aprox
 const vp=o.v===undefined?1:o.v, op=o.orbit===undefined?1:o.orbit, sp=o.star===undefined?1:o.star;
 ctx.save();ctx.translate(x,y);ctx.scale(s/100,s/100);ctx.fillStyle='#fff';ctx.strokeStyle='#fff';

 // orbita detras
 const drawOrbit=(from,to)=>{if(to<=from)return;ctx.beginPath();ctx.ellipse(0,8,rx,ry,rot,from,to);ctx.lineWidth=5.5;ctx.lineCap='round';ctx.stroke()};
 const a0=Math.PI*0.55, total=Math.PI*2*op;
 // back half (PI..2PI relative) drawn first

 ctx.save();ctx.globalAlpha*=0.9;drawOrbit(Math.PI*1.12,end);ctx.restore();
 // V
 if(vp>0){ctx.save();ctx.beginPath();const k=vp;
  ctx.moveTo(-44,-46);ctx.lineTo(-24,-46);ctx.lineTo(0,lerp(-46,22,k));ctx.lineTo(24,-46);ctx.lineTo(44,-46);ctx.lineTo(lerp(44,8,k),lerp(-46,44,k));ctx.lineTo(lerp(-44,-8,k),lerp(-46,44,k));ctx.closePath();
  ctx.globalAlpha*=clamp(vp*1.5);ctx.fill();ctx.restore()}
 // parte frontal de la orbita sobre la V
 {const fs=a0,fe2=Math.min(end,Math.PI*1.12);if(fe2>fs){ctx.save();ctx.lineWidth=5.5;ctx.lineCap='round';ctx.beginPath();ctx.ellipse(0,8,rx,ry,rot,fs,fe2);ctx.stroke();ctx.restore()}}
 // destello en la cabeza de la orbita
 if(o.flash){const ha=end;const hx=Math.cos(ha)*rx,hy=Math.sin(ha)*ry;const X=hx*Math.cos(rot)-hy*Math.sin(rot),Y=hx*Math.sin(rot)+hy*Math.cos(rot)+8;glow(X,Y,34,'rgba(170,220,255,0.95)',o.flash);vstar(X,Y,12*o.flash,o.flash)}
 if(sp>0){ctx.save();const ss=sp;glow(54,-48,30,'rgba(200,230,255,0.8)',ss*0.6);vstar(54,-48,15*eback(clamp(ss)),1);ctx.restore()}
 ctx.restore()}

// ======================= FONDO DE ESTRELLAS =======================
const STARS=[];{const r=rng(7);for(let i=0;i<700;i++)STARS.push({x:(r()-.5)*2.4,y:(r()-.5)*1.5,z:r(),b:0.4+r()*0.6})}
function travel(t){ // distancia recorrida (determinista)
 const base=0.035*t; const warp=1.6*(eio(pr(t,2.6,4.4))); const warp2=0.9*eio(pr(t,79.5,81.5)); const mid=0.25*eio(pr(t,65.5,67))+0.25*eio(pr(t,72.5,73.6));
 return base+warp+warp2+mid}
function starfield(t,alpha){

 const bl=st.btn||'Siguiente';const bw=tw(bl,{s:14,w:700})+48;const bx=cwU-24-bw;const hn=hov('tour-next');
 rr(bx,by,bw,34,17);ctx.fillStyle=st.btn?`rgba(255,255,255,${0.9+0.1*hn})`:`rgba(255,255,255,${0.08+0.1*hn})`;ctx.fill();
 txt(bl,bx+bw/2-8,by+22,{s:14,w:700,a:'center',c:st.btn?'#05070d':'#e6ebf5'});txt('→',bx+bw-22+3*hn,by+22,{s:14,w:700,a:'center',c:st.btn?'#05070d':'#e6ebf5'});
 hit('tour-next',bx,by,bw,34);
 ctx.restore()}

function updateHover(dt){let id=null;if(MOUSE.x>=0)id=hitAt(MOUSE.x,MOUSE.y);if(id!==HOVER){HOVER=id;if(id&&AC&&id!=='chart')sHover()}
 const seen=new Set(HITS.map(h=>h.id));const k=Math.min(1,dt*12);
 for(const s of seen){const tgt=s===HOVER&&s!=='chart'?1:0;HV[s]=(HV[s]||0)+(tgt-(HV[s]||0))*k}
 for(const s in HV)if(!seen.has(s))HV[s]*=1-k;
 const st=curStep();const w=waiting();cv.style.cursor=(w&&(isTarget(HOVER,st)||HOVER==='tour-next'))?'pointer':(HOVER&&HOVER!=='chart'?'default':'default')}

// ---------- barra de capítulos ----------
const trackEl=document.getElementById('track');const segs=CH.map((c,i)=>{const end=i<CH.length-1?CH[i+1][0]:DUR;const d=document.createElement('div');d.className='seg';d.dataset.l=c[1];d.style.flex=String(end-c[0]);d.innerHTML='<i><b></b></i>';d.onclick=e=>{e.stopPropagation();jump(i)};trackEl.appendChild(d);return{el:d,b:d.querySelector('b'),s:c[0],e:end}});
function jump(i){ensureAudio();T=CH[i][0];si=STEPS.findIndex(s=>s.t>=T+0.001);if(si<0)si=STEPS.length;if(i===0){T=0;si=0}stepA=0;manual=false;setPP();whoosh()}
function updBar(){segs.forEach(s=>{s.b.style.width=(clamp((T-s.s)/(s.e-s.s))*100)+'%'})}
const pp=document.getElementById('pp');function setPP(){pp.innerHTML=manual?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';pp.title=manual?'Reproducir':'Pausa'}
pp.onclick=e=>{e.stopPropagation();manual=!manual;setPP()};
const snd=document.getElementById('snd');const sndOnSvg=snd.innerHTML;snd.onclick=e=>{e.stopPropagation();ensureAudio();soundOn=!soundOn;if(master)master.gain.setTargetAtTime(soundOn?1:0,AC.currentTime,0.1);snd.innerHTML=soundOn?sndOnSvg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'};
document.getElementById('skip').onclick=e=>{e.stopPropagation();finish(true)};

// ---------- fin ----------
function finish(skipped){if(done)return;done=true;
 const theme=['clasico','minimal','espacial'][SEL.theme]||'clasico',plan=['gratis','plus','infinity'][SEL.plan]||null;
 try{localStorage.setItem('vortex_tour_done','1')}catch(e){}
 try{(window.parent!==window?window.parent:window).postMessage({type:'vortex:tour-finished',skipped,theme,plan},'*')}catch(e){}
 if(musicG)musicG.gain.setTargetAtTime(0,AC.currentTime,0.4);
 document.getElementById('bye').classList.add('on');
 const next=new URLSearchParams(location.search).get('next');const go=document.getElementById('go');if(next)go.href=next;
 setTimeout(()=>{go.classList.add('on');if(window.parent===window&&next){location.href=next}},1400)}

// ---------- entrada ----------
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();MOUSE.x=(e.clientX-r.left)*cv.width/r.width;MOUSE.y=(e.clientY-r.top)*cv.height/r.height});
cv.addEventListener('pointerleave',()=>{MOUSE.x=-1;MOUSE.y=-1});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;const id=hitAt(x,y);const st=curStep();
 if(!waiting()){if(manual){manual=false;setPP()}return}
 if(id==='tour-next'){if(st.sel&&SEL[st.sel]<0)SEL[st.sel]=0;advance();return}
 if(isTarget(id,st)){if(st.sel){SEL[st.sel]=+id.split('-')[1];sClick();setTimeout(()=>{if(curStep()===st)advance()},450);return}advance();return}
 nudge=A;sNudge()});
addEventListener('keydown',e=>{if(e.key==='Escape'){finish(true);return}if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();if(waiting())advance();else{manual=!manual;setPP()}}});

function frame(now){const dt=Math.min(0.05,(now-(last||now))/1000);last=now;A+=dt;
 const st=curStep();
 if(!manual&&!(st&&T>=st.t)){T=Math.min(T+dt,st?st.t:DUR)}else IDLE+=dt;
 PLAYING=!manual&&!waiting();if(!PLAYING)stepA+=dt;
 const c=CH.reduce((a,ch,i)=>T>=ch[0]?i:a,0);if(c!==curCh){curCh=c;if(AC&&c>0)whoosh()}
 render(T);drawStep();updateHover(dt);updBar();
 requestAnimationFrame(frame)}
window.FONTS.then(()=>{fit();stage.classList.add('on');requestAnimationFrame(frame)});

</script></body></html>
