# Worker de notificaciones push de VORTEX (alertas con la app cerrada). Lo publica .github/workflows/deploy-push-worker.yml.
name = "vortex-push"
main = "push-alerts.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

# Revisa alertas, movimientos bruscos y (al empezar cada hora) el Screener 1h/4h, cada minuto
[triggers]
crons = ["* * * * *"]

# Enlace a sí mismo: el Screener reparte el trabajo en llamadas pequeñas (cada una con su propio límite de CPU)
[[services]]
binding = "SELF"
service = "vortex-push"

# KV «vortex-push»: alertas, suscripciones y claves VAPID (se crean solas)
[[kv_namespaces]]
binding = "KV"
id = "c6d98896a2a3496b89228e7994cedda2"

[vars]
ALLOWED_ORIGIN = "https://soobroon-beep.github.io,https://vortex-nexus.pages.dev,https://dev.vortex-nexus.pages.dev"
